name: Release

on:
  workflow_run:
    workflows: ['Test']
    branches: ['main']
    types:
      - completed

jobs:
  # workflow_run checks out the tip of main, which is not the commit Test verified once another merge lands.
  tested-commit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.compare.outputs.is-latest }}
    steps:
      - name: Compare the tested commit with main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "tested=$TESTED_SHA latest=$latest_sha"
          if [ "$latest_sha" = "$TESTED_SHA" ]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
          fi

  main:
    needs: tested-commit
    if: ${{ needs.tested-commit.outputs.is-latest == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          token: '${{ secrets.TOLGEE_MACHINE_PAT }}'

      - name: Setup node
        uses: actions/setup-node@v1
        with:
          node-version: '20.x'

      - name: Set git globals
        run: |
          git config --local user.email "machine@tolgee.io"
          git config --local user.name "Tolgee Machine"

      - name: Npm ci
        run: npm ci

      - name: Run get new version
        run: npm run release-dry

      - name: Set version property
        id: version
        run: echo ::set-output name=VERSION::$(test -e .VERSION && echo v$(cat .VERSION))

      - name: Upgrade version in manifest.json
        run: sh upgrade_manifest.sh $(cat .VERSION)

      - name: Build (build & test)
        run: export NODE_ENV=production && npm run build

      - name: Set git globals
        run: |
          git config --local user.email "machine@tolgee.io"
          git config --local user.name "Tolgee Machine"

      - name: Run npm release
        if: ${{ steps.version.outputs.VERSION != '' }}
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.TOLGEE_MACHINE_PAT }}

      - name: Create Release
        if: ${{ steps.version.outputs.VERSION != '' }}
        env:
          # Publishing with GITHUB_TOKEN would not trigger publish-stores.yml.
          GH_TOKEN: ${{ secrets.TOLGEE_MACHINE_PAT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cp dist-zip/chrome.zip "dist-zip/Tolgee-chrome-$VERSION.zip"
          cp dist-zip/firefox.zip "dist-zip/Tolgee-firefox-$VERSION.zip"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "" \
            --verify-tag \
            "dist-zip/Tolgee-chrome-$VERSION.zip" \
            "dist-zip/Tolgee-firefox-$VERSION.zip"
